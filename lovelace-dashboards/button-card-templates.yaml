        \ d=\"M4 94 H96\" stroke=\"#b0bec5\" stroke-width=\"1.5\"/>'\n    + (on ? '<ellipse cx=\"50\"\
        \ cy=\"96\" rx=\"10\" ry=\"2.6\" fill=\"#ff1744\">' + pulse + '</ellipse>'\n          + bub(36,\
        \ 0, 3) + bub(50, .9, 4) + bub(63, 1.8, 2.6) : '')\n    + (i.tone === 'warn' ? '<ellipse cx=\"\
        50\" cy=\"96\" rx=\"10\" ry=\"2.6\" fill=\"#ffab00\"/>' : '')\n    + (i.label === 'Finished' ?\
        \ '<path d=\"M40 50 l7 7 l14 -14\" stroke=\"#43a047\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"\
        round\" stroke-linejoin=\"round\"/>' : '');\n}\n\nreturn '<svg viewBox=\"0 0 100 100\" width=\"\
        100%\" height=\"100%\">' + svg + '</svg>';\n]]]"
    styles:
      card:
      - height: 100%
      - min-height: 168px
      - padding: 10px 6px
      grid:
      - grid-template-areas: '"art" "n" "s" "l"'
      - grid-template-columns: minmax(0, 1fr)
      - grid-template-rows: 64px auto auto auto
      - justify-items: center
      - align-content: start
      - gap: 2px
      custom_fields:
        art:
        - width: 64px
        - height: 64px
      name:
      - justify-self: center
      - font-size: 12px
      - font-weight: '500'
      - color: var(--primary-text-color)
      - margin-top: 4px
      state:
      - justify-self: center
      label:
      - justify-self: center
      - font-size: 11px
      - color: var(--secondary-text-color)
      - white-space: normal
      - text-align: center
      - line-height: '1.3'
    label: '[[[ return variables.info; ]]]'
