# button-card templates used by the live dashboards (exported 2026-09-25)
#
# Paste under `button_card_templates:` in a dashboard's raw config. These are
# the only templates any live view references; everything a card shows is
# derived at render time from the area registry (see
# docs/self-maintaining-dashboards.md), so none of them names a room.
#
#   vg_stat       a stat tile: small muted label above a large value. TWO LINES,
#                 so it fits `grid_options.rows: 1` (56px) exactly.
#   vg_room       vg_stat with the value line replaced by a label.
#   vg_meter      vg_stat plus a 3px meter track, for a value against a limit.
#   vg_room_card  Home's room card: reading, status line, one-tap lamp. Takes
#                 one variable, `area`, and resolves the rest from `hass`.
#   vg_action     a big, obvious action tile for Home.
#   vg_socket     a metered socket: live power bar and its switch.
#   vg_outlet     an unmetered outlet switch.
#
# SIZING IS THE WHOLE POINT OF THESE, 2026-09-23
# ----------------------------------------------
# First attempt used upstream's `standard_btn_layout`, which sets
# `aspect_ratio: 1/1`: height follows WIDTH, so one template rendered a small
# square at `columns: 4` and a giant one at `columns: 12`.
#
# Second attempt fixed that with `height: 100%` but left every card at
# `rows: 2` (120px) carrying ~64px of content, so more than half of each card
# was empty - on phone and laptop alike.
#
# These are two lines tall and sized for `rows: 1`:
#     6px padding + 14px name + 22px value + 6px padding = 48px  (of 56px)
# `vg_meter` adds a 3px track and still fits. Keep it that way: if a third line
# is ever needed, it needs `rows: 2` and a reason, not a silent overflow.
#
# Columns stay on the 6 / 12 / full ladder. In a `column_span: 2` section that
# is 4-up on a laptop and 2-up on a phone; `columns: 4` gave SIX across a laptop
# and truncated every label.
#
# `tests/dashboards/lint.py` C3 and C7 enforce all of the above, and
# `mutate.py` proves they still fail when it is undone.
#
# These three are duplicated into the admin-panel dashboard's own
# `button_card_templates`. button-card resolves templates per dashboard, and
# defining them on only one is what broke all three admin views.

button_card_templates:
  vg_stat:
    show_icon: true
    show_name: true
    show_state: true
    show_label: false
    show_last_changed: false
    styles:
      card:
      - height: 100%
      - padding: 6px 12px
      - overflow: hidden
      grid:
      - grid-template-areas: '"i n" "i s"'
      - grid-template-columns: 26px minmax(0, 1fr)
      - grid-template-rows: auto auto
      - align-content: center
      - gap: 0px 10px
      img_cell:
      - justify-self: start
      - align-self: center
      icon:
      - width: 22px
      - height: 22px
      name:
      - justify-self: start
      - font-size: 11px
      - font-weight: '400'
      - line-height: '1.25'
      - color: var(--secondary-text-color)
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%
      state:
      - justify-self: start
      - font-size: 18px
      - font-weight: '500'
      - line-height: '1.25'
      - color: var(--primary-text-color)
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%
    state:
    - value: unavailable
      styles:
        state:
        - font-size: 13px
        - color: var(--error-color)
    - value: unknown
      styles:
        state:
        - font-size: 13px
        - color: var(--secondary-text-color)
  vg_room:
    template: vg_stat
    show_state: false
    show_label: true
    styles:
      grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: 26px minmax(0, 1fr)
      - grid-template-rows: auto auto
      - align-content: center
      - gap: 0px 10px
      name:
      - justify-self: start
      - font-size: 13px
      - font-weight: '500'
      - line-height: '1.25'
      - color: var(--primary-text-color)
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%
      label:
      - justify-self: start
      - font-size: 11px
      - line-height: '1.25'
      - color: var(--secondary-text-color)
      - white-space: nowrap
      - overflow: hidden
      - text-overflow: ellipsis
      - max-width: 100%
  vg_meter:
    template: vg_stat
    custom_fields:
      bar: '[[[ var v = parseFloat(entity.state); var mx = parseFloat(variables.max) || 100; if (isNaN(v))
        return ''''; var p = Math.max(0, Math.min(100, (v / mx) * 100)); var c = variables.tint || ''var(--primary-color)'';
        return ''<div style="width:100%;height:3px;border-radius:2px;background:var(--divider-color);overflow:hidden"><div
        style="width:'' + p + ''%;height:3px;border-radius:2px;background:'' + c + ''"></div></div>'';
        ]]]'
    styles:
      grid:
      - grid-template-areas: '"i n" "i s" "bar bar"'
      - grid-template-columns: 26px minmax(0, 1fr)
      - grid-template-rows: auto auto 3px
      - align-content: center
      - gap: 0px 10px
      custom_fields:
        bar:
        - justify-self: stretch
        - align-self: end
        - margin-top: 3px
  vg_room_card:
    variables:
      area: ''
      page: ''
      special: ''
      info: "[[[\nvar A = variables.area; var ents = (hass && hass.entities) || {}; var devs = (hass &&\
        \ hass.devices) || {};\nvar r = {lights: [], lit: 0, grp: null, clim: null, act: {}, pres: null,\
        \ temp: null, hum: null, co2: null, alerts: [], open: []};\nfor (var id in ents) {\n  var e =\
        \ ents[id];\n  var a = e.area_id || (e.device_id && devs[e.device_id] ? devs[e.device_id].area_id\
        \ : null);\n  if (a !== A || e.hidden) continue;\n  var s = states[id]; if (!s) continue;\n  var\
        \ dom = id.substring(0, id.indexOf('.')); var dc = s.attributes.device_class; var lab = e.labels\
        \ || [];\n  if (dom === 'light' && !e.entity_category) {\n    if (e.platform === 'magic_areas')\
        \ { if (!r.grp || id.slice(-11) === '_all_lights') r.grp = id; } else { r.lights.push(id); if\
        \ (s.state === 'on') r.lit++; }\n  } else if (dom === 'climate') {\n    if (!r.clim || id.indexOf('_ac')\
        \ >= 0) r.clim = id;\n    var ha = s.attributes.hvac_action;\n    if (ha) { if (ha === 'heating'\
        \ || ha === 'preheating') r.act.heat = 1; else if (ha === 'cooling') r.act.cool = 1; else if (ha\
        \ === 'drying') r.act.dry = 1; else if (ha === 'fan') r.act.fan = 1; }\n    else { var M = {heat:\
        \ 'heat', cool: 'cool', dry: 'dry', fan_only: 'fan', auto: 'auto', heat_cool: 'auto'}; if (M[s.state])\
        \ r.act[M[s.state]] = 1; }\n  } else if (dom === 'binary_sensor') {\n    if (e.platform === 'magic_areas'\
        \ && dc === 'occupancy') r.pres = id;\n    else if (['moisture', 'smoke', 'gas', 'carbon_monoxide',\
        \ 'safety'].indexOf(dc) >= 0 && s.state === 'on') r.alerts.push(dc);\n    else if (['window',\
        \ 'door', 'opening', 'garage_door'].indexOf(dc) >= 0 && s.state === 'on') r.open.push(dc);\n \
        \ } else if (dom === 'sensor' && lab.indexOf('on_room_page') >= 0) {\n    if (dc === 'temperature')\
        \ r.temp = id; else if (dc === 'humidity') r.hum = id; else if (dc === 'carbon_dioxide') r.co2\
        \ = id;\n  }\n}\nreturn r;\n]]]"
    show_icon: true
    show_name: true
    show_state: false
    show_label: false
    icon: '[[[ var a = hass.areas && hass.areas[variables.area]; return (a && a.icon) || ''mdi:floor-plan'';
      ]]]'
    tap_action:
      action: navigate
      navigation_path: '[[[ return variables.page; ]]]'
    custom_fields:
      reading: '[[[

        var i = variables.info; var out = '''';

        var t = i.temp ? parseFloat(states[i.temp].state) : NaN;

        var h = i.hum ? parseFloat(states[i.hum].state) : NaN;

        if (!isNaN(t)) out += ''<span style="font-size:24px;font-weight:500">'' + t.toFixed(1) + ''°</span>'';

        if (!isNaN(h)) out += ''<span style="font-size:15px;color:var(--secondary-text-color);margin-left:8px">''
        + Math.round(h) + ''%</span>'';

        return out || ''&nbsp;'';

        ]]]'
      status: "[[[\nvar i = variables.info; var p = [];\nvar W = {moisture: 'Water leak', smoke: 'Smoke',\
        \ gas: 'Gas', carbon_monoxide: 'Carbon monoxide', safety: 'Safety alarm'};\nfor (var k = 0; k\
        \ < i.alerts.length; k++) p.push('<b style=\"color:#f44336\">' + (W[i.alerts[k]] || 'Alarm') +\
        \ '</b>');\nif (i.open.length) p.push('<b style=\"color:#ff9800\">' + (i.open.length === 1 ? i.open[0].replace('_',\
        \ ' ') + ' open' : i.open.length + ' open') + '</b>');\nvar a = i.act || {};\nvar w = a.heat &&\
        \ a.cool ? '<b style=\"color:#ff9800\">Heating + cooling</b>' : a.heat ? 'Heating' : a.cool ?\
        \ 'Cooling' : a.dry ? 'Drying' : a.fan ? 'Fan' : a.auto ? 'Auto' : '';\nif (w) p.push(w);\nif\
        \ (variables.special === 'kitchen') {\n  var ck = states['sensor.house_cooktop_operation_state'],\
        \ ov = states['sensor.house_oven_operation_state'];\n  if (ck && ck.state === 'run') p.push('<b\
        \ style=\"color:#ff5722\">Cooktop on</b>');\n  if (ov && (ov.state === 'run' || ov.state === 'delayedstart'))\
        \ p.push('<b style=\"color:#ff5722\">Oven on</b>');\n}\nif (variables.special === 'terrace') {\
        \ var mo = states['binary_sensor.outdoor_motion_occupancy']; if (mo && mo.state === 'on') p.push('Motion');\
        \ }\nvar pr = i.pres ? states[i.pres] : null;\nvar ps = pr ? (pr.attributes.presence_sensors ||\
