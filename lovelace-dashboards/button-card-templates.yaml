        50\" rx=\"4\" fill=\"#0b0d0f\"/>'\n    + (on ? '<rect x=\"17\" y=\"36\" width=\"66\" height=\"\
        50\" rx=\"4\" fill=\"url(#g)\">' + pulse + '</rect>'\n          + '<path d=\"M26 79 h48\" stroke=\"\
        #ff3d00\" stroke-width=\"2\" stroke-linecap=\"round\"/>' : '')\n    + '<path d=\"M20 40 L34 40\
