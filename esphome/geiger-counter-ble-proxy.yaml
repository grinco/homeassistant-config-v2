# Sanitised reference copy. The live file lives in the ESPHome app's config
# directory; the API encryption key is redacted here because this repo is public.

substitutions:
  name: geiger-counter-ble-proxy
  friendly_name: Geiger-counter-ble-proxy

  # 30-pin ESP32 DevKit: the silk numbers ARE the GPIO numbers, so "D13" is GPIO13.
  # (On an Uno-shaped ESP32 D1 R32 the pin marked D13 would be GPIO18 instead --
  # not this board.)
  geiger_pin: GPIO13

# ---------------------------------------------------------------------------
# WIRING -- as built: the board's pulse output goes STRAIGHT to ${geiger_pin},
# and it is powered from the VIN/GND pins next to D13. It has run that way for
# years without damaging the board, so nothing here asks for it to be changed.
#
# Why that works, even though ESP32 GPIOs are not 5 V tolerant: these interface
# boards almost always put a series resistor on the output, or drive it through
# an open-collector transistor. With a series resistor in the path, the ESP32's
# internal clamp diode conducts and holds the pin near 3.6 V at a current the
# resistor limits. Out of spec on paper, benign in practice, and consistent with
# the observed lifetime.
#
# The open question is only worth one measurement, whenever convenient: DC volts
# between the signal line and GND with the tube powered. The line IDLES at the
# pull-up rail and is pulsed low, so the idle reading is what the pin sits at
# essentially all the time.
#   - idles at ~3.3 V  -> nothing to do, the board references 3V3
#   - idles at ~5 V    -> it has been clamping for years. Still fine as-is; a
#                         10k/15k divider (5 x 15/25 = 3.0 V) would make it
#                         nominal if that is ever worth the soldering.
# Either way this config counts FALLING edges, which is the idle-high, pulse-low
# behaviour both cases produce.
#
# Two failure signatures once it is running:
#   - exactly 0 CPM, always  -> the line is being held at a fixed level. It is NOT
#     floating (that reads thousands), so something is clamping it: see THE SIGNAL
#     PIN below, which is where this lands nine times out of ten
#   - hundreds/thousands CPM -> the input is floating, because the output is
#     open-collector with no pull-up. Add a 10k from the signal line to 3V3.
#
# Background is roughly 10-30 CPM for a J305. A reading in that band after a few
# minutes means it works; the first minute is meaningless, the counter needs a
# full window before it reports anything real.
#
# THE SIGNAL PIN -- the single most common wiring error on these boards.
#
#   The pulse output is the pin marked OUT, or INT on some boards, or -- on the
#   RadiationD v1.1 / CAJOE, whose silkscreen is wrong -- the one printed VIN.
#   ESPHome's own device page for that board says so outright: "The print on the
#   PCB is wrong, VIN is the signal."
#
#   VCC IS NOT THE SIGNAL. It is a power input. The standard header is
#   VCC / GND / OUT: power the board from VCC+GND, take pulses from OUT.
#
#   2026-09-22: GPIO13 was confirmed wired to the pin labelled VCC. That holds the
#   pin at a rail and delivers no pulses -- firmware healthy, counter alive, zero
#   counts forever, nothing damaged. Move the wire to OUT / INT / VIN.
#
# HIGH VOLTAGE: the board steps up to ~400 V for the tube, and that side stays
# energised briefly after power is removed. Do not probe it.
# ---------------------------------------------------------------------------

packages:
  esphome.bluetooth-proxy: "github://esphome/bluetooth-proxies/esp32-generic/esp32-generic.yaml@main"

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

api:
  encryption:
    key: !secret api_encryption_key   # redacted for the public repo

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  # Counts per minute is the tube-INDEPENDENT measurement, so it is what this
  # device publishes. Converting counts to a dose rate depends on which tube is
  # actually fitted, and that conversion lives in Home Assistant behind a helper
  # rather than being compiled in here: confirming the tube marking must not
  # mean reflashing the board, and it must not lose the count history either.
  - platform: pulse_counter
    pin:
      number: ${geiger_pin}
      mode:
        input: true
      inverted: false
    # TEMPORARY, while the counter reads zero: count BOTH edges and halve.
    #
    # Edge polarity cannot be the cause of zero counts -- every pulse has a
    # rising AND a falling edge, so counting falling edges already registers one
    # per pulse whichever way round the board drives the line. Counting both and
    # multiplying by 0.5 gives the same number, and removes the question for good.
    #
    # Revert to `rising_edge: DISABLE` / `falling_edge: INCREMENT` with no
    # multiply once counts are arriving: two edges per pulse is more exposed to
    # ringing being miscounted than one is.
    count_mode:
      rising_edge: INCREMENT
      falling_edge: INCREMENT
    filters:
      - multiply: 0.5
    # PCNT's glitch filter is 1023 APB clock cycles = 12.8 us at 80 MHz, so 13us is
    # the ceiling and ESPHome rejects more at compile time. Software counting
    # (use_pcnt: false) would allow a longer filter and is the wrong trade here:
    # this board is also a bluetooth proxy, so an ISR counting pulses competes
    # with radio interrupts and drops events exactly when the proxy is busy.
    #
    # Set to 1us, not 13us, while the counter reads zero. A filter only ever
    # REMOVES counts, so during bring-up it is the one setting that can turn a
    # working signal into silence -- and it must be ruled out before anything is
    # concluded about the wiring. Raise it to 13us once counts are arriving AND
    # only if the rate looks inflated by noise.
    internal_filter: 1us
    update_interval: 60s
    name: "Background radiation CPM"
    id: geiger_cpm
    unit_of_measurement: "CPM"
    icon: "mdi:radioactive"
    accuracy_decimals: 0
    state_class: measurement
    total:
      name: "Background radiation total counts"
      id: geiger_total
      unit_of_measurement: "counts"
      icon: "mdi:radioactive"
      accuracy_decimals: 0
      state_class: total_increasing
