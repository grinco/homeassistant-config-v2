# guide: https://community.home-assistant.io/t/hw-622-board-setup-single-relay-single-input-opto-isolated-esp8266-esp-12f-3-80aud/391116

esphome:
  name: hw-622
  friendly_name: HW-622 (Paradox Alarm)

esp8266:
  board: esp12e
    

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable logging
logger:
  baud_rate: 0
# Enable Home Assistant API
api:
  encryption:
    key: !secret hw_622_api_key

external_components:
  # switch back to oxan once the PR71 is merged
  - source: github://grob6000/esphome-stream-server
uart:
  id: uart_bus
  # add further configuration for the UART here
  baud_rate: 57600
  tx_pin: GPIO1
  rx_pin: GPIO3

stream_server:
    uart_id: uart_bus
    port: 10000

ota:
  platform: esphome
  password: !secret hw_622_ota_password

# Use the blue LED in the device as a status LED, which will blink if there are warnings (slow) or errors (fast)
status_led:
  pin:
    number: GPIO2
    inverted: True

# One  relay outputs, exposed as switches in Home Assistant
switch:
  - platform: gpio
    pin: GPIO4
    name: "alarm_trigger"
    id: alarm_trigger
    #inverted: true

# One sensor input
binary_sensor:
  - platform: gpio
    pin: 
      number: GPIO5
      mode:
        input: true
        pullup: true
    name: "alarm_input"
    device_class: problem
